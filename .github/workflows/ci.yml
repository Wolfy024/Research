name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: python -m scripts.validate_results
      - run: python -m neural_watermark smoke --steps 1 --samples 2 --batch-size 2 --image-size 16 --message-length 2 --hidden-channels 4 --checkpoint /tmp/watermark-smoke.pt --output /tmp/watermark-smoke.json
